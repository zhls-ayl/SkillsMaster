# release.yml — 标签触发的自动化 Release workflow
#
# 当推送 v* 格式的 tag 时（如 v1.0.0），自动执行：
#   1. 运行测试确保代码质量
#   2. 构建发布矩阵产物
#   3. 创建 GitHub Release 并上传 zip / dmg 文件
#
# 用法：
#   git tag v1.0.0
#   git push <github-remote> v1.0.0

name: Release

on:
  push:
    tags: ['v*']

# 权限设置：仅为当前 Release workflow 申请创建 Release 所需的 contents: write。
# 不依赖把仓库默认 Workflow permissions 提升为全局 write。
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Print Swift version
        run: swift --version

      - name: Verify translation-capable toolchain
        run: |
          swift_version="$(swift --version | awk '/Apple Swift version/ {print $4}')"
          IFS='.' read -r major minor _ <<< "${swift_version}"
          if (( major < 6 || (major == 6 && minor < 2) )); then
            echo "SkillsMaster release builds require Swift 6.2+ so Translation.framework support is compiled in."
            exit 1
          fi

      # 先运行测试，确保发布版本质量
      - name: Run tests
        run: swift test

      # 从 git tag 中提取版本号：v1.0.0 → 1.0.0
      # GITHUB_REF_NAME 是触发工作流的 tag 名称
      # ${GITHUB_REF_NAME#v} 是 bash 参数展开语法，去掉前缀 "v"
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 构建发布矩阵产物：universal / arm64 / x86_64 zip + universal dmg
      - name: Build release assets
        run: ./scripts/package-app.sh --version ${{ steps.version.outputs.VERSION }} --release-assets

      # 验证构建产物的架构（应同时包含 arm64 和 x86_64）
      - name: Verify universal binary
        run: file build/SkillsMaster.app/Contents/MacOS/SkillsMaster

      - name: Verify release assets exist
        run: |
          test -f "build/SkillsMaster-v${{ steps.version.outputs.VERSION }}-universal.zip"
          test -f "build/SkillsMaster-v${{ steps.version.outputs.VERSION }}-arm64.zip"
          test -f "build/SkillsMaster-v${{ steps.version.outputs.VERSION }}-x86_64.zip"
          test -f "build/SkillsMaster-v${{ steps.version.outputs.VERSION }}-universal.dmg"

      # 使用 GitHub CLI 创建 / 更新 Release，避免依赖已弃用 Node 20 的 JS action runtime
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "build/SkillsMaster-v${{ steps.version.outputs.VERSION }}-universal.zip"
            "build/SkillsMaster-v${{ steps.version.outputs.VERSION }}-arm64.zip"
            "build/SkillsMaster-v${{ steps.version.outputs.VERSION }}-x86_64.zip"
            "build/SkillsMaster-v${{ steps.version.outputs.VERSION }}-universal.dmg"
          )

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
